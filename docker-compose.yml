services:
  ai-career-recommendation:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-career-recommendation:local
    container_name: ai-career-recommendation
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs
    restart: unless-stopped
